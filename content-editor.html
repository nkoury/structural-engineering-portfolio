<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Editor | Noah Koury</title>
    <meta
      name="description"
      content="Local content editor for the Noah Koury structural engineering portfolio."
    />
    <meta name="theme-color" content="#f7f3eb" />
    <link rel="stylesheet" href="css/styles.css?v=20260715-direct-publish" />
  </head>
  <body class="editor-body">
    <main class="content-editor-shell">
      <header class="content-editor-header">
        <div>
          <p class="project-kicker">Portfolio Editor</p>
          <h1>Portfolio Content</h1>
        </div>
        <div class="editor-actions" aria-label="Content editor actions">
          <label class="editor-file-button">
            Import content.js
            <input type="file" accept=".js,.json" data-import-content />
          </label>
          <button type="button" data-save-content>Save content.js</button>
          <button type="button" data-download-content>Download content.js</button>
          <button type="button" data-copy-content>Copy</button>
        </div>
      </header>

      <p class="editor-status" data-editor-status>Ready.</p>
      <section class="editor-publish-panel" aria-labelledby="github-publish-title">
        <div>
          <p class="project-kicker">Direct publishing</p>
          <h2 id="github-publish-title">Publish Content to GitHub</h2>
          <p>
            Use a fine-grained GitHub token with contents read/write access for this
            repository only. The token stays in this browser session and is never
            written into content.js.
          </p>
        </div>
        <div class="editor-publish-controls">
          <label class="editor-token-field">
            <span>GitHub token</span>
            <input
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="github_pat_..."
              data-github-token
            />
          </label>
          <button type="button" data-publish-github>Publish content to GitHub</button>
          <a href="https://noahkoury.com" target="_blank" rel="noreferrer">Open live site</a>
        </div>
      </section>
      <form class="content-editor-form" data-content-editor></form>
    </main>

    <script src="js/content-bootstrap.js?v=20260715-direct-publish" data-content-src="js/content.js"></script>
    <script src="js/content-editor.js?v=20260715-per-project-section"></script>
    <script src="js/analytics.js"></script>
  </body>
</html>
